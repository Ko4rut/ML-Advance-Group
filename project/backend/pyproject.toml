[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-ai"
version = "0.1.0"
description = "Xiangqi rules engine and environment foundation"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "PyYAML>=6,<7"]
drive = ["google-auth>=2.30,<3", "requests>=2.31,<3"]
test = ["httpx>=0.27,<1"]

[project.scripts]
xiangqi = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
