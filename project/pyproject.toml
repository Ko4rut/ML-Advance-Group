[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-ai"
version = "0.1.0"
description = "Xiangqi rules engine and environment foundation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
xiangqi = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
