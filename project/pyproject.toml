[project]
name = "xiangqi-ai"
version = "0.1.0"
description = "Shared Xiangqi engine and agent evaluation foundation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
xiangqi = "xiangqi_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
