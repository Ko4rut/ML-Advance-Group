name: Xiangqi performance and resume regression

on:
  pull_request:
    paths:
      - 'project/backend/src/**'
      - 'project/backend/tests/**'
      - 'project/backend/notebooks/**'
      - '.github/workflows/alphabeta-performance-tests.yml'
  push:
    branches:
      - perf/alphabeta-batch-resume

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Relevant unit tests
        env:
          PYTHONPATH: ../..:.
        run: |
          python -m unittest -v \
            tests.test_batch_games \
            tests.test_search_optimization \
            tests.test_alphabeta_agent
      - name: Original vs optimized microbenchmark
        env:
          PYTHONPATH: ../..:.
        run: |
          python -m src.evaluation.compare_alphabeta --depth 2 --positions 3 --repeats 1
